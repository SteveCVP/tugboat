name: Tugboat validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tugboat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate mission truth
        env:
          TUGBOAT_ACTOR: ${{ github.actor }}
          TUGBOAT_RUNTIME: github-actions
        run: node .tugboat/runtime/scripts/tugboat.mjs validate --dir tugboat --json
